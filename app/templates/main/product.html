{% extends "base.html" %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow-md overflow-hidden">
    <div class="md:flex">
        <div class="md:w-1/2">
            <img src="{{ product.image_url }}" alt="{{ product.name }}" class="w-full h-96 object-cover">
        </div>
        <div class="md:w-1/2 p-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-4">{{ product.name }}</h1>
            <p class="text-gray-600 mb-6">{{ product.description }}</p>
            
            <div class="mb-6">
                <span class="text-red-600 text-4xl font-bold">¥{{ "%.2f"|format(product.price) }}</span>
            </div>
            
            <div class="mb-6">
                <span class="text-gray-600">库存: {{ product.stock }}</span>
            </div>
            
            <form action="{{ url_for('shop.add_to_cart', product_id=product.id) }}" method="post" class="space-y-4">
                <div class="flex items-center space-x-4">
                    <label for="quantity" class="text-gray-700">数量:</label>
                    <select name="quantity" id="quantity" class="border border-gray-300 rounded-md px-4 py-2">
                        {% for i in range(1, product.stock + 1) %}
                            <option value="{{ i }}">{{ i }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <button type="submit" class="w-full bg-red-600 text-white py-3 rounded-md hover:bg-red-700 transition duration-200">
                    加入购物车
                </button>
            </form>
            
            <div class="mt-8">
                <h2 class="text-xl font-semibold mb-4">商品详情</h2>
                <div class="prose max-w-none">
                    {{ product.description }}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
